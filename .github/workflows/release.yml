name: Build (Actions Artifact)

on:
  push:
    branches:
      - gofix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and compile all platforms
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Run Go tests
        run: go test ./...

      - name: Run Python archive safety tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build all supported platforms
        run: bash ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UnRen-Go-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
